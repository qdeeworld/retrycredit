  <text x="798" y="369" fill="#15170f" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="13">CONNECTED SOURCE WALLET</text>

  <rect x="782" y="411" width="329" height="74" fill="#f6c84f" stroke="#15170f" stroke-width="1"/>
  <text x="802" y="455" fill="#15170f" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700">CHECK ELIGIBILITY</text>
