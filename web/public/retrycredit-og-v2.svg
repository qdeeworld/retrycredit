  <rect x="116" y="139" width="8" height="25" fill="#ebe6d8" stroke="#15170f" stroke-width="1"/>

  <text x="91" y="225" fill="#15170f" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="59" font-weight="700" letter-spacing="-2.2">
